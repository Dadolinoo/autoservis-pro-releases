releaseNotes: >
  Novo u verziji 2.3.69 (test):

  - Na završenom nalogu (Završeno / Predano) gumb „Pošalji u Knjigovodstvo”: nalog ide u mapu veza, a Knjigovodstvo ga prima kao nacrt računa spreman za fiskalizaciju

  - Gumb je vidljiv ako je uključen modul Računi ili ako je Knjigovodstvo instalirano (najjednostavnije ILI pravilo)

  - Jedan nalog = jedan račun (ponovno slanje se ne knjiži dvaput). Na nalogu se vidi status „Poslano u Knjigovodstvo” ili „Račun izdan”

  - Ispravak: „Izdaj račun” na nalogu sada ovisi o modulu Računi (u 2.3.68 je greškom bio vezan uz Skladište)

  Novo u verziji 2.3.68 (test):

  - Moduli po kupcu iz Admina: nalozi, termini, ponude, čekaonica, narudžbe, izvještaji, te novi računi, primke, skladište i skidanje dijelova s naloga

  - Stari ključ bez polja „moduli” zadržava sve postojeće mogućnosti, a novi moduli ostaju isključeni dok ih ne uključiš

  - Vraćeni računi, primke, stanje skladišta i automatsko skidanje dijelova, svaki kao zaseban modul

  - Primke i u DH-Logixu i u Knjigovodstvu, zajedničko stanje kroz mapu veza, bez dvostrukog knjiženja (isti primkaId; jedan nalog = jedan račun)

  - Stupac popusta čitljiv na tamnoj temi; gumb „Popust” za označene ili sve usluge

  - U Postavkama prekidač „Prikaži savjete” (isključen = nema automatskih savjeta, gumb savjetnika ostaje)
