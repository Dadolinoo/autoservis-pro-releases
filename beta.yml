releaseNotes: >
  Novo u verziji 2.3.70 (test):

  - Uklonjene Windows obavijesti — sve obavijesti samo u programu.


  Novo u verziji 2.3.69 (test):

  - Na završenom nalogu (Završeno / Predano) gumb „Pošalji u Knjigovodstvo”:
  nalog ide u mapu veza, a Knjigovodstvo ga prima kao nacrt računa spreman za
  fiskalizaciju

  - Gumb je vidljiv ako je uključen modul Računi ili ako je Knjigovodstvo
  instalirano (najjednostavnije ILI pravilo)

  - Jedan nalog = jedan račun (ponovno slanje se ne knjiži dvaput). Na nalogu se
  vidi status „Poslano u Knjigovodstvo” ili „Račun izdan”

  - Ispravak: „Izdaj račun” na nalogu sada ovisi o modulu Računi (u 2.3.68 je
  greškom bio vezan uz Skladište)
