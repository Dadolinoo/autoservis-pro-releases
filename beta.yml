releaseNotes: |
  Novo u verziji 2.3.40 (test):
  - Podsjetnik za termine: Windows obavijest i kartica u sredini ekrana koja izlazi iz ikone Kalendara i vraća se u nju. U Postavkama birate 15, 30 ili 60 min prije, ili isključeno.
  - Kalendar › Tjedan: kartice se same prilagođavaju broju dizalica i trajanju, ništa se ne preklapa. Boja po dizalici, prikazana i nedjelja.
  - Sve obavijesti u programu animirano izlaze iz kuta i vraćaju se u njega.
  - Automatska prijava grešaka (bez osobnih podataka) da ih brže popravimo.

  Novo u verziji 2.3.39:
  - Radni nalog › Podijeli: „Zatraži ponudu za dijelove” (Ciak), „Izradi ponudu za kupca” i „Naruči dijelove” iz ponude.
