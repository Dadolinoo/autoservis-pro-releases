releaseNotes: >
  Novo u verziji 2.3.68 (test):

  - Moduli po kupcu iz Admina: nalozi, termini, ponude, čekaonica, narudžbe,
  izvještaji, te novi računi, primke, skladište i skidanje dijelova s naloga

  - Stari ključ bez polja „moduli” zadržava sve postojeće mogućnosti, a novi
  moduli ostaju isključeni dok ih ne uključiš

  - Vraćeni računi, primke, stanje skladišta i automatsko skidanje dijelova,
  svaki kao zaseban modul

  - Primke i u DH-Logixu i u Knjigovodstvu, zajedničko stanje kroz mapu veza,
  bez dvostrukog knjiženja (isti primkaId; jedan nalog = jedan račun)

  - Stupac popusta čitljiv na tamnoj temi; gumb „Popust” za označene ili sve
  usluge

  - U Postavkama prekidač „Prikaži savjete” (isključen = nema automatskih
  savjeta, gumb savjetnika ostaje)
