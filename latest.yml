releaseNotes: |
  Novo u verziji 2.3.29:
  - Naruči dijelove: Ciak Auto je uvijek prvi i već odabran (oznaka „★ Zadano”), odmah ispod Tokić, Inter Cars i „Drugi…” – jedan klik; podaci o stranci se i dalje ne šalju
  - Ponude › Podijeli (novi zeleni gumb u ponudi i u izborniku popisa): na WhatsApp birate „Kao slika” (cijela ponuda kao jedna jasna slika – program je kopira, u WhatsAppu samo pritisnete Ctrl+V pa Enter) ili „Kao tekst”; na e-mail ponuda ide samo kao PDF
  - Izvještaji › Zarada: novi gumb „Dodaj dnevni prihod” (datum, iznos usluga u €, napomena) – iznos se pribraja u Prihod i Zaradu od rada, u popisu je označen „ručno” i može se urediti ili obrisati; sinkronizira se s ostalim računalima
  - Usluge i cjenik: u svakom retku vidljivi gumbi „Uredi” i crveni „Obriši” (bez tri točkice); kvačice za označavanje usluga
  - Usluge › „Rabat za sve”: upišete postotak i birate sve usluge, jednu kategoriju ili samo označene – prije spremanja vidite staru i novu cijenu; svaka usluga se i dalje može zasebno urediti
  - Brisanje usluge i dnevnog prihoda traži jasnu, veliku potvrdu; stari radni nalozi i ponude ostaju nepromijenjeni

  Novo u verziji 2.3.28:
  - Radni nalog › Podijeli: nova prva opcija „Naruči dijelove (tekst)” – kod prijema stranke pošaljete dobavljaču (Tokić, Inter Cars, Ciak Auto ili drugi) broj šasije i što treba, npr. „svi filteri + kompletne kočnice”
  - Radi i kad nalog još nema dijelova – samo upišete što treba naručiti; po želji dodatna napomena (npr. „hitno, do sutra”)
  - Poruka sadrži samo vozilo (marka, model, godina, motor), VIN i naziv servisa – podaci o stranci (ime, telefon, adresa) se ne šalju; registracija samo ako je uključite kvačicom
  - Brzi unosi: jednim klikom dodate „Mali servis (svi filteri)”, „Kočnice komplet (prednje)”, „Zupčasti remen set”… – popis gumba uredite u Postavke › Dobavljači › Brzi unosi
  - Ako vozilo nema upisan VIN, program upozori i možete ga upisati odmah (i spremiti u karticu vozila) – poslati se može i bez njega
  - WhatsApp se otvori s gotovom porukom (aplikacija, a ako nije instalirana – WhatsApp Web) – samo pritisnete Enter; može i e-mail ili „Kopiraj tekst”
  - Postavke › Dobavljači: WhatsApp broj i e-mail dobavljača upišete jednom (i dodate svoje dobavljače); novi broj upisan u prozoru „Podijeli” program može sam zapamtiti
  - Svaka poslana narudžba zapisuje se na nalog (dobavljač, datum i vrijeme, što je naručeno): oznaka „Naručeno ✓” u popisu naloga i odjeljak „Narudžbe dijelova” u nalogu – zapis znači da je poruka poslana iz programa, ne potvrdu dobavljača
  - Cijeli radni nalog (PDF) za klijenta ostaje kao druga opcija
