releaseNotes: |
  Novo u verziji 2.3.32:
  - Obavijesti: u zaglavlju su „Označi sve kao pročitano” (sivo kad je sve već pročitano) i „Obriši obavijesti”. Brisanje traži potvrdu i skida samo obavijesti. Radni nalozi, termini i ostali podaci ostaju.
  - Čekaonica: ručni red vozila bez termina i bez sortiranja po datumu. Strelicama ili povlačenjem mijenjate redoslijed. Iz retka otvarate postojeći obrazac za termin ili radni nalog, već ispunjen.
  - Izvještaji › Zarada i dobavljači: kartice zarade i duga, graf zadnjih 12 mjeseci i krug duga. Stranica se otvara na „bez PDV-a”. „s PDV-om” i dalje radi.
  - Narudžba dijelova: zadani „Mali servis” je filteri, ulje i čep i brtva za ispust ulja, bez količine ulja. Vlastiti brzi unos ostaje kakav jest.
  - Postavke › Izgled: Svijetla ili Tamna tema za cijeli program.
  - Postavke servisa: kartice preko cijele širine; na užem prozoru kartice su u karticama Općenito, Podaci servisa, Cijene i PDV, Dobavljači, Ispis, Sigurnosna kopija i Izgled.
  - Cjenik: otvoren uređivač više ne siječe stupac cijene. Tablice se sužavaju s prozorom i prvo skrivaju manje važne stupce.
  - Mobilna aplikacija: desktop u sinkronizaciju upisuje stvarnu značajku mobilna (Pro). Osnovni paket na mobitelu vidi zaključavanje, podaci ostaju.
