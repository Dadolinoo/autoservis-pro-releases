releaseNotes: |
  Novo u verziji 2.3.30:
  - Radni nalog › Dijelovi po dobavljačima: zasebna kartica po dobavljaču (Ciak Auto, Tokić, Inter Cars, Drugi). Upišite ukupni iznos ili otvorite „+ Stavke” (naziv + cijena) — zbroj se računa sam. Gumb „+ Dodaj dobavljača”.
  - Sažetak naloga: Ukupno rad, Ukupno dijelovi, Ukupno naloga.
  - Izvještaji › Zarada i dobavljači: Dan / Tjedan / Mjesec / Godina / Raspon; KPI rad / dug / ukupno; kartice po dobavljaču s Označi plaćeno.
  - Stari test-retci dijelova (VPC/rabat) automatski se pretvaraju u stavke na karticama dobavljača.
  - Radni nalog: kvačica „Dodaj PDV (25 %)” – PDV se dodaje na usluge (rad) samo kad je uključena; stari nalozi ostaju nepromijenjeni.
  - Postavke › Porez i dokumenti: nova kvačica „Cijene usluga su bez PDV-a – automatski dodaj PDV 25 %” (isključena po defaultu). Kad je uključena, cjenik uz cijenu pokazuje PDV i Ukupno, a novi nalozi (i nalozi iz termina) kreću s uključenim PDV-om.
  - Drugi dobavljač: možete upisati vlastiti naziv dobavljača.
  - Naruči dijelove: poruka bez internih šifri (npr. ART-0001) – samo „1. filter ulja – 1 kom”; na kraju naziv servisa i „Poslano iz programa DH-Logix”.
