releaseNotes: |
  Novo u verziji 2.3.26:
  - Izvještaji: nova kartica „Zarada i dobavljači” – po tjednu ili mjesecu
  - Za svakog dobavljača (Tokić, Inter Cars, Ciak Auto i ostali) prikazan je ukupni iznos i broj računa, te „Ukupno plaćeno dobavljačima”
  - Rezultat: Prihod ukupno (završeni i predani radni nalozi) − plaćeno dobavljačima = OSTALO VAMA; posebno „Od toga zarada od rada (usluge)”
  - Gumb „Dodaj račun dobavljača”: dobavljač, datum, ukupan iznos i (po želji) broj računa
  - Upisani računi mogu se urediti ili obrisati; obrisani idu u Koš i vraćaju se jednim klikom
  - Prikaz s PDV-om ili bez PDV-a; ispis i PDF na jednoj A4 stranici
  - Računi dobavljača sinkroniziraju se između računala i ulaze u sigurnosne kopije
  - Radni nalog: novi zeleni gumb „Podijeli” – popis dijelova za narudžbu (šifra, naziv, količina + vozilo i VIN, bez cijena) dobavljaču (Tokić, Inter Cars, Ciak Auto d.o.o. ili drugi) ili cijeli radni nalog u PDF-u klijentu
  - Slanje preko WhatsAppa ili e-maila uz pregled poruke prije slanja; broj ili e-mail dobavljača program pamti za iduću narudžbu
  - Stavke radnog naloga: novi stupac „Šifra” za dijelove
  - Popravljeno automatsko ažuriranje: „Preuzimanje nije uspjelo” kod preuzimanja nove verzije više se ne pojavljuje
