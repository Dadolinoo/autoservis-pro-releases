releaseNotes: |
  Novo u verziji 2.3.70:
  - Uklonjene Windows obavijesti — sve obavijesti samo u programu.

  Novo u verziji 2.3.69:
  - Na završenom nalogu (Završeno / Predano) gumb „Pošalji u Knjigovodstvo”: nalog ide u mapu veza, a Knjigovodstvo ga prima kao nacrt računa spreman za fiskalizaciju.
  - Gumb je vidljiv ako je uključen modul Računi ili ako je Knjigovodstvo instalirano.
  - Jedan nalog = jedan račun. Na nalogu se vidi status „Poslano u Knjigovodstvo” ili „Račun izdan”.
  - Ispravak: „Izdaj račun” na nalogu sada ovisi o modulu Računi.

  Novo u verziji 2.3.68:
  - Moduli po kupcu iz Admina: nalozi, termini, ponude, čekaonica, narudžbe, izvještaji, te računi, primke, skladište i skidanje dijelova s naloga.
  - Stari ključ bez polja „moduli” zadržava sve postojeće mogućnosti, a novi moduli ostaju isključeni dok ih ne uključiš.
  - Primke u DH-Logixu i Knjigovodstvu dijele stanje kroz mapu veza, bez dvostrukog knjiženja.
  - Stupac popusta čitljiv na tamnoj temi; gumb „Popust” za označene ili sve usluge.
  - U Postavkama prekidač „Prikaži savjete” (isključen = nema automatskih savjeta, gumb savjetnika ostaje).
